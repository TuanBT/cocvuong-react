<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Cóc Vương LAN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header - Simple tech style -->
    <header class="header">
      <div class="logo">⚡</div>
      <h1>Cóc Vương LAN</h1>
      <p class="subtitle">Máy chủ chấm điểm nội bộ</p>
    </header>

    <!-- Server Info Card -->
    <div class="card status-card">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Đang khởi động...</span>
      </div>
      <div class="server-address">
        <span class="label">📡</span>
        <input type="text" id="wsUrl" readonly value="..." class="address-input">
        <button class="btn-copy" id="btnCopy" title="Copy địa chỉ">📋</button>
      </div>
    </div>

    <!-- Connections Card - Grouped by Arena -->
    <div class="card connections-card">
      <h2>🔌 Kết nối hiện tại</h2>
      
      <!-- Sân A -->
      <div class="arena-group" id="arenaGroupA">
        <div class="arena-header">
          <span class="arena-badge arena-a">Sân A</span>
        </div>
        <div class="arena-grid">
          <div class="role-column">
            <div class="role-header gs">Giám Sát</div>
            <div class="connections-list" id="gsListA">
              <div class="connection-item empty"><span class="dot"></span><span class="name">Chưa kết nối</span></div>
            </div>
          </div>
          <div class="role-column">
            <div class="role-header gd">Giám Định</div>
            <div class="connections-list" id="gdListA">
              <div class="connection-item empty"><span class="dot"></span><span class="name">Chưa kết nối</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sân B -->
      <div class="arena-group" id="arenaGroupB">
        <div class="arena-header">
          <span class="arena-badge arena-b">Sân B</span>
        </div>
        <div class="arena-grid">
          <div class="role-column">
            <div class="role-header gs">Giám Sát</div>
            <div class="connections-list" id="gsListB">
              <div class="connection-item empty"><span class="dot"></span><span class="name">Chưa kết nối</span></div>
            </div>
          </div>
          <div class="role-column">
            <div class="role-header gd">Giám Định</div>
            <div class="connections-list" id="gdListB">
              <div class="connection-item empty"><span class="dot"></span><span class="name">Chưa kết nối</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Không xác định sân -->
      <div class="arena-group" id="arenaGroupUnknown" style="display:none;">
        <div class="arena-header">
          <span class="arena-badge arena-unknown">Khác</span>
        </div>
        <div class="connections-list" id="unknownList"></div>
      </div>
    </div>

    <!-- Log Card - Tall -->
    <div class="card log-card tall">
      <h2>📋 Nhật ký hoạt động</h2>
      <div class="log-container" id="logContainer">
        <div class="log-entry info">
          <span class="time">--:--:--</span>
          <span class="message">Khởi động ứng dụng...</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-secondary" id="btnRestart">
        ↻ Khởi động lại
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Cóc Vương LAN v1.0.0</p>
    </footer>
  </div>

  <!-- Hidden elements for backward compatibility -->
  <span id="localIP" style="display:none;">---</span>
  <span id="wsPort" style="display:none;">---</span>
  <img id="qrCode" style="display:none;" src="" alt="">
  <div id="qrLoading" style="display:none;"></div>
  <div id="connectionsList" style="display:none;"></div>

  <script src="renderer.js"></script>
</body>
</html>
