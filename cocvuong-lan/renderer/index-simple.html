<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Cóc Vương LAN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #4ade80;
    }
    
    .header p {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    
    .status-dot.running {
      background: #4ade80;
      animation: none;
    }
    
    .status-dot.error {
      background: #ef4444;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-text {
      font-size: 14px;
      font-weight: 500;
    }
    
    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .url-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      color: #4ade80;
      font-family: monospace;
      font-size: 13px;
    }
    
    .btn {
      background: rgba(74, 222, 128, 0.2);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: #4ade80;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: rgba(74, 222, 128, 0.3);
    }
    
    .qr-section {
      text-align: center;
    }
    
    .qr-code {
      background: #fff;
      padding: 8px;
      border-radius: 8px;
      display: inline-block;
      margin: 8px 0;
    }
    
    .qr-code img {
      display: block;
      width: 140px;
      height: 140px;
    }
    
    .qr-hint {
      font-size: 11px;
      color: #888;
    }
    
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .clients-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .arena-group {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    
    .arena-group:last-child {
      margin-bottom: 0;
    }
    
    .arena-header {
      font-size: 12px;
      font-weight: 600;
      color: #4ade80;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .client-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .client-item:last-child {
      margin-bottom: 0;
    }
    
    .client-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }
    
    .client-type {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    
    .client-type.gs {
      background: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }
    
    .client-type.gd {
      background: rgba(168, 85, 247, 0.3);
      color: #c084fc;
    }
    
    .client-name {
      flex: 1;
      color: #ccc;
    }
    
    .empty-text {
      color: #666;
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
    
    .log-container {
      max-height: 120px;
      overflow-y: auto;
      font-size: 11px;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      padding: 8px;
    }
    
    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-time {
      color: #666;
      margin-right: 8px;
    }
    
    .log-entry.success { color: #4ade80; }
    .log-entry.warning { color: #f59e0b; }
    .log-entry.error { color: #ef4444; }
    .log-entry.info { color: #888; }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .btn-open {
      flex: 1;
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }
    
    .btn-open:hover {
      background: rgba(59, 130, 246, 0.3);
    }
    
    .version-footer {
      text-align: center;
      font-size: 10px;
      color: #555;
      margin-top: 12px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌐 Cóc Vương LAN</h1>
    <p>Chấm điểm qua mạng LAN</p>
  </div>

  <!-- Status Card -->
  <div class="card">
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Đang khởi động...</span>
    </div>
    
    <div class="url-row">
      <input type="text" class="url-input" id="httpUrl" value="..." readonly style="color: #60a5fa;">
      <button class="btn" id="btnCopyHttp" title="Copy">📋</button>
    </div>
    
    <div class="qr-section">
      <div class="qr-code">
        <img id="qrCode" src="" alt="QR Code">
      </div>
      <p class="qr-hint" id="qrHint">Quét QR hoặc nhập link trên vào trình duyệt</p>
    </div>
  </div>

  <!-- Clients Card -->
  <div class="card">
    <div class="section-title">🔌 Kết nối (<span id="clientsCount">0</span>)</div>
    <div class="clients-list" id="clientsList">
      <div class="empty-text">Chưa có kết nối nào</div>
    </div>
  </div>

  <!-- Log Card -->
  <div class="card">
    <div class="section-title">📋 Nhật ký</div>
    <div class="log-container" id="logContainer">
      <div class="log-entry info">
        <span class="log-time">--:--</span>
        <span>Đang khởi động...</span>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-open" id="btnOpenMain">🌐 Mở CocVuong</button>
    <button class="btn" id="btnRestart">🔄 Restart</button>
  </div>

  <!-- Version Footer -->
  <div class="version-footer" id="versionFooter">
    Build: --
  </div>

  <script src="renderer-simple.js"></script>
</body>
</html>
